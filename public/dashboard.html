<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Lab Results</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .logo-circle {
  width: 55px;         /* Set any size you want */
  height: 55px;        /* Must match the width exactly to ensure a perfect circle */
  border-radius: 50%;   /* This curves the corners completely into a circle */
  object-fit: cover;    /* Prevents your logo from squishing if the original image is a rectangle */
}

</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-brand">
      <!-- <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"> -->
        <div>
          <img class="logo-circle" src="images/logos.png" alt="Hospital logo">
        </div>
        <!-- <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.16)"/>
        <path d="M20 10v20M10 20h20" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="13" stroke="#fff" stroke-width="2" opacity="0.6"/> -->
      <!-- </svg> -->
      <div class="brand-text">
        <h1 id="page-title">My Lab Results</h1>
        <div class="tagline">Secure online access to your results</div>
      </div>
    </div>
    <button id="btn-logout">Log out</button>
  </div>

  <div class="wide-container">
    <div class="card patient-info-card" id="patient-info-card" style="display:none"></div>
    <div class="card" id="results-card">
      <div class="spinner-text">Loading your results&hellip;</div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
